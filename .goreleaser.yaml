version: 2

project_name: satchel

before:
  hooks:
    - go mod tidy

builds:
  - id: satchel
    main: ./cmd/satchel
    binary: satchel
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/richardcase/satchel/internal/buildinfo.version={{ .Version }}
      - -X github.com/richardcase/satchel/internal/buildinfo.commit={{ .Commit }}
      - -X github.com/richardcase/satchel/internal/buildinfo.date={{ .Date }}

universal_binaries:
  - id: satchel
    replace: true

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE

nfpms:
  - id: packages
    package_name: satchel
    formats: [deb, rpm]
    maintainer: Richard Case <richmcase@gmail.com>
    description: Install, update and remove agent skills.
    homepage: https://github.com/richardcase/satchel
    license: Apache-2.0
    bindir: /usr/bin

homebrew_casks:
  - repository:
      owner: richardcase
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/richardcase/satchel
    description: Install, update and remove agent skills.
    license: Apache-2.0
    binaries:
      - satchel
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/satchel"]
          end

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^feat'
      order: 0
    - title: Fixes
      regexp: '^fix'
      order: 1
    - title: Other
      order: 99
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
